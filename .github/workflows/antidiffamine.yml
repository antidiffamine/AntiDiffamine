# Drop this file into your repo at .github/workflows/antidiffamine.yml
#
# What it does: whenever a PR branch is force-pushed, it runs AntiDiffamine
# to show you exactly what changed relative to the base branch — rendered
# the same way as GitHub's compare page.
#
# Prerequisites:
#   1. No secrets needed — GITHUB_TOKEN is sufficient.
#   2. GitHub Pages is optional. If enabled (Settings → Pages → gh-pages branch),
#      a hosted diff link is posted. If not, only the inline Actions summary is linked.

name: AntiDiffamine — PR force-push diff

# Workflow-level permissions are required for external reusable workflows —
# job-level permissions are not propagated across repository boundaries.
permissions:
  contents: write       # needed to push to gh-pages (only matters when html_enabled: true)
  pull-requests: write  # needed to post PR comments
  issues: write
  actions: write

on:
  pull_request_target:
    types: [synchronize]  # fires on every push to the PR branch, including force-pushes

jobs:
  antidiffamine:
    # Only run when the branch was actually force-pushed (before != after)
    if: github.event.forced == true
    uses: antidiffamine/AntiDiffamine/.github/workflows/antidiffamine-demo.yml@main
    with:
      repo: ${{ github.repository }}
      source: ${{ github.event.before }}   # commit SHA before the force-push
      target: ${{ github.event.after }}    # commit SHA after the force-push
      head_branch: ${{ github.base_ref }}  # base branch of the PR (e.g. main)
      html_enabled: true                   # set to false to skip HTML rendering and Pages deployment

  comment-result:
    needs: antidiffamine
    if: needs.antidiffamine.outputs.bases_match != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write 
      issues: write
      actions: write
    steps:
      - name: Comment with diff link
        uses: actions/github-script@v7
        with:
          script: |
            const pageUrl = '${{ needs.antidiffamine.outputs.page_url }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const lines = [
              `🔁 **Force-push detected** — here's what changed:`,
              ``,
              `- 📋 [Inline diff (Actions summary)](${runUrl}) — available now`,
            ];
            if (pageUrl) {
              lines.splice(2, 0, `- 📄 [Rendered diff (GitHub Pages)](${pageUrl}) — live in ~2–5 min`);
            }
            lines.push(``, `> Compares \`${{ github.event.before }}\` → \`${{ github.event.after }}\` relative to \`${{ github.base_ref }}\``);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: lines.join('\n')
            });
